services:
  - type: web
    name: neuroplan-3d-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: GEMINI_API_KEY
        sync: false
      - key: EXTRA_CORS_ORIGINS
        sync: false
    healthCheckPath: /health
